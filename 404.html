<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Page not found | Priyanka Sharma</title>
  <meta name="robots" content="noindex">
  <meta name="color-scheme" content="only light">
  <link rel="icon" href="/favicon.ico" sizes="32x32">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <!-- This page is self-contained on purpose: GitHub Pages shows it for any missing address,
       at any folder depth, so it cannot rely on relative links to the stylesheet. -->
  <style>
    :root {
      color-scheme: light;
      color-scheme: only light;
      --bg: #f8f5ef;
      --ink: #161b22;
      --ink-2: #47505c;
      --accent: #a3412a;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 2rem;
      background: var(--bg);
      color: var(--ink);
      font: 1.0625rem/1.6 system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
      text-align: center;
    }
    .code {
      margin: 0 0 0.75rem;
      font-size: 0.75rem;
      font-weight: 600;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--accent);
    }
    h1 {
      margin: 0;
      font: 500 clamp(2.25rem, 1.6rem + 3vw, 3.75rem)/1.05 "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif;
      letter-spacing: -0.02em;
    }
    p { max-width: 30rem; margin: 1rem auto 0; color: var(--ink-2); }
    a.btn {
      display: inline-block;
      margin-top: 2rem;
      padding: 0.8125rem 1.375rem;
      border-radius: 999px;
      background: var(--ink);
      color: var(--bg);
      font-size: 0.9375rem;
      font-weight: 600;
      text-decoration: none;
    }
    a.btn:hover, a.btn:focus-visible { background: var(--accent); color: #fff; }
  </style>
</head>
<body>
  <main>
    <p class="code">Error 404</p>
    <h1>Page not found</h1>
    <p>The page you were looking for has moved or does not exist.</p>
    <a class="btn" href="/">Go to the homepage</a>
  </main>
</body>
</html>
